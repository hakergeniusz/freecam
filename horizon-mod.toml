id = "freecam"
name = "Freecam"
version = "0.3.1"
description = "Control your camera separately from your player: F4 detaches it, WASD and Space fly it through blocks, F4 plus a digit holds one of nine tripod spots."
authors = ["hakergeniusz"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# Every tick, on every Game: the mod's two keys poll through their
# registered mappings' held state (the window's physical keys stand where
# the old native_key events stood; a world's close or a fresh open resets
# the baseline, and a mapping a lost release left down is retired), the
# stored settings refresh, the camera flies one tick's worth, exits on
# damage or a closed world run, and the freeze gate is written.
[[native.mixin]]
id = "tick"
target = "horizon_client::game::native_hooks::client_tick_pre::Game<'_>::native_client_tick_pre"
kind = "HEAD"
helper = "src/mixins/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The toast, centered above the hotbar (the crosshair layer's post-draw).
[[native.mixin]]
id = "hud"
target = "horizon_client::game::native_hooks::base::Game<'_>::native_gui_layer_post"
kind = "HEAD"
helper = "src/mixins/hud.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "layer", ty = "&str", value = "layer" },
  { name = "batch", ty = "&mut HudBatch", value = "draw" },
]

# A mapped key went down or up: the fly keys and the hotbar digits are
# taken from the player while the camera is detached or a combo key is
# held — presses only, since a release must reach the game's bookkeeping.
[[native.mixin]]
id = "mapped"
target = "horizon_client::game::play_input::Game<'_>::mapped_key"
kind = "HEAD"
cancellable = true
helper = "src/mixins/mapped.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "repeat", ty = "bool", value = "repeat" },
]

# A view turn: the freecam's, not the player's, while it holds the camera.
[[native.mixin]]
id = "turn"
target = "horizon_client::game::perspective::Game<'_>::turn_player"
kind = "HEAD"
cancellable = true
helper = "src/mixins/turn.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "xo", ty = "f64", value = "xo" },
  { name = "yo", ty = "f64", value = "yo" },
]

# The view the frame renders from: the freecam's while it holds the camera.
[[native.mixin]]
id = "camera"
target = "horizon_client::game::perspective::Game<'_>::camera_view"
kind = "HEAD"
cancellable = true
helper = "src/mixins/camera.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# The player's own body hides with the camera, when the setting asks.
[[native.mixin]]
id = "body"
target = "horizon_client::game::perspective::Game<'_>::own_body_in_view"
kind = "HEAD"
cancellable = true
helper = "src/mixins/body.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

# F5 cannot disturb the detached view.
[[native.mixin]]
id = "cycle"
target = "horizon_client::game::perspective::Game<'_>::cycle_camera"
kind = "HEAD"
cancellable = true
helper = "src/mixins/cycle.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
]

# Targeting starts at the camera and points along its view, when the
# interaction setting asks.
[[native.mixin]]
id = "aim"
target = "horizon_client::game::Game<'_>::aim"
kind = "HEAD"
cancellable = true
helper = "src/mixins/aim.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

# The block a click targets: while the camera's ray stands for the player's
# clicks, the pick runs along it out to the camera's own reach, so the
# mining, placing and picking pipeline follows the camera's target.
[[native.mixin]]
id = "pick"
target = "horizon_client::game::Game<'_>::pick"
kind = "HEAD"
cancellable = true
helper = "src/mixins/pick.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
]

# Clicks do nothing while the camera is detached and the interaction is
# Off. The mapping's source says whose hand is on the button first: the
# person's clicks count toward the camera's aim, and the agent source's —
# horizon-ctl, a script, a driving bot's — count for nothing, are never
# eaten, and keep the game's own targeting.
[[native.mixin]]
id = "mouse"
target = "horizon_client::game::play_input::Game<'_>::mouse_mapping"
kind = "HEAD"
cancellable = true
helper = "src/mixins/mouse.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
  { name = "source", ty = "horizon_client::held::Source", value = "source" },
]

# The freeze: the local player's body tick is skipped, so no gravity, no
# momentum and no input drift move them while the camera flies. The tick's
# own keys decide: a tick that drives the player runs anyway, so
# automation works with the camera away, and a bot's mining or building in
# place goes on. (The sim itself moved into a crate the staged build
# cannot patch; this caller is the same freeze one step up, in the game
# crate.)
[[native.mixin]]
id = "freeze"
target = "horizon_client::game::remote::tick::Game<'_>::tick_local_player_body"
kind = "HEAD"
cancellable = true
helper = "src/mixins/freeze.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
