[package]
name = "freecam"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Control your camera separately from your player. A Horizon native mod ported from the Freecam mod."
publish = false

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
